[package]
name = "bluenet-mobile"
version = "0.3.0"
edition = "2021"
# Upstream desktop integration harnesses are reference material; Android tests are inline.
autotests = false
rust-version = "1.95"
license = "MIT"

[lib]
name = "bluenet"
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.8.4"
anyhow = "1"
directories = "6"
hex = "0.4"
jni = "0.21.1"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
md4 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
zeroize = "1"

[[test]]
name = "network_management"
path = "tests/network_management.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
